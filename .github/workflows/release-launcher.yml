# .github/workflows/release-launcher.yml
name: Release Launcher
on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build
        run: pyinstaller packaging/launcher.spec
      # Give each OS a distinct filename. PyInstaller names the binary
      # "Block-Robot" on macOS/Linux and "Block-Robot.exe" on Windows, so
      # without this the mac and linux builds collide on the release (same
      # name → one overwrites the other).
      - name: Rename binary (macOS)
        if: runner.os == 'macOS'
        run: mv dist/Block-Robot dist/Block-Robot-macos
      - name: Rename binary (Linux)
        if: runner.os == 'Linux'
        run: mv dist/Block-Robot dist/Block-Robot-linux
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.os }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
