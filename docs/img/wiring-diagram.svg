<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
    <style>
      .box   { rx:12; stroke-width:2; }
      .esp   { fill:#0f2a3f; stroke:#38bdf8; }
      .pca   { fill:#0f172a; stroke:#22d3aa; }
      .psu   { fill:#2a1b0f; stroke:#f59e0b; }
      .cam   { fill:#241033; stroke:#a855f7; }
      .servo { fill:#111a2e; stroke:#5C81A6; rx:8; }
      .title { fill:#e2e8f0; font-weight:700; }
      .sub   { fill:#94a3b8; font-size:12px; }
      .pin   { fill:#cbd5e1; font-size:12px; font-family:ui-monospace,Menlo,monospace; }
      .lbl   { fill:#e2e8f0; font-size:13px; }
      .i2c   { stroke:#38bdf8; stroke-width:2.4; fill:none; }
      .pwr   { stroke:#f59e0b; stroke-width:3;   fill:none; }
      .gnd   { stroke:#64748b; stroke-width:2.4; fill:none; }
      .sig   { stroke:#5C81A6; stroke-width:2;   fill:none; }
      .wifi  { stroke:#a855f7; stroke-width:2.4; stroke-dasharray:7 5; fill:none; }
      .cap   { fill:#22d3aa; font-size:12px; font-weight:600; }
      .warn  { fill:#f59e0b; font-size:12px; font-weight:600; }
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="720" fill="#0b1220"/>
  <text x="590" y="38" text-anchor="middle" class="title" font-size="24">Block Robot — Device Wiring</text>
  <text x="590" y="60" text-anchor="middle" class="sub">Arm controller (ESP32 + PCA9685) is wired; the ESP32-CAM is wireless. All grounds are common.</text>

  <!-- ESP32 -->
  <rect x="60" y="120" width="230" height="220" class="box esp"/>
  <text x="175" y="150" text-anchor="middle" class="title" font-size="17">ESP32 DevKit V1</text>
  <text x="175" y="170" text-anchor="middle" class="sub">arm controller · USB powered</text>
  <text x="80" y="205" class="pin">GPIO 21 (SDA)</text>
  <text x="80" y="232" class="pin">GPIO 22 (SCL)</text>
  <text x="80" y="259" class="pin">3.3V</text>
  <text x="80" y="286" class="pin">GND</text>
  <text x="80" y="320" class="sub">◀ USB from laptop (power + flash)</text>
  <circle cx="272" cy="200" r="4" fill="#38bdf8"/>
  <circle cx="272" cy="227" r="4" fill="#38bdf8"/>
  <circle cx="272" cy="254" r="4" fill="#38bdf8"/>
  <circle cx="272" cy="281" r="4" fill="#64748b"/>

  <!-- PCA9685 -->
  <rect x="470" y="120" width="250" height="300" class="box pca"/>
  <text x="595" y="150" text-anchor="middle" class="title" font-size="17">PCA9685</text>
  <text x="595" y="170" text-anchor="middle" class="sub">16-ch PWM driver · I²C 0x40</text>
  <!-- logic side pins (left) -->
  <text x="486" y="205" class="pin">SDA</text>
  <text x="486" y="232" class="pin">SCL</text>
  <text x="486" y="259" class="pin">VCC (logic)</text>
  <text x="486" y="286" class="pin">GND</text>
  <circle cx="478" cy="200" r="4" fill="#38bdf8"/>
  <circle cx="478" cy="227" r="4" fill="#38bdf8"/>
  <circle cx="478" cy="254" r="4" fill="#38bdf8"/>
  <circle cx="478" cy="281" r="4" fill="#64748b"/>
  <!-- V+ terminal block (bottom) -->
  <text x="595" y="360" text-anchor="middle" class="pin">V+  /  GND  terminal block</text>
  <text x="595" y="392" text-anchor="middle" class="warn">servo power in — NOT from ESP32</text>
  <circle cx="560" cy="368" r="4" fill="#f59e0b"/>
  <circle cx="630" cy="368" r="4" fill="#64748b"/>
  <!-- servo channel pins (right) -->
  <circle cx="712" cy="200" r="4" fill="#5C81A6"/>
  <circle cx="712" cy="230" r="4" fill="#5C81A6"/>
  <circle cx="712" cy="260" r="4" fill="#5C81A6"/>
  <circle cx="712" cy="290" r="4" fill="#5C81A6"/>
  <circle cx="712" cy="320" r="4" fill="#5C81A6"/>

  <!-- I2C wires ESP32 -> PCA9685 -->
  <path class="i2c" d="M272,200 H478" marker-end="url(#arrow)"/>
  <path class="i2c" d="M272,227 H478" marker-end="url(#arrow)"/>
  <path class="i2c" d="M272,254 H478" marker-end="url(#arrow)"/>
  <path class="gnd" d="M272,281 H478"/>
  <text x="375" y="192" text-anchor="middle" class="sub">I²C + logic power</text>

  <!-- Power supply -->
  <rect x="440" y="520" width="300" height="120" class="box psu"/>
  <text x="590" y="552" text-anchor="middle" class="title" font-size="17">External 5 V / 3 A supply</text>
  <text x="590" y="574" text-anchor="middle" class="sub">isolated servo rail · via barrel jack</text>
  <text x="590" y="602" text-anchor="middle" class="cap">add ~1000 µF cap across V+ / GND</text>
  <circle cx="560" cy="522" r="4" fill="#f59e0b"/>
  <circle cx="630" cy="522" r="4" fill="#64748b"/>
  <!-- PSU -> PCA9685 V+ -->
  <path class="pwr" d="M560,522 V420 V400" marker-end="url(#arrow)"/>
  <path class="gnd" d="M630,522 V420 V400" marker-end="url(#arrow)"/>
  <text x="505" y="470" text-anchor="middle" class="warn">5V</text>
  <text x="650" y="470" text-anchor="middle" class="sub">GND</text>

  <!-- Servos -->
  <text x="900" y="150" text-anchor="middle" class="title" font-size="15">5 servos → PCA9685 channels</text>
  <text x="900" y="170" text-anchor="middle" class="sub">(channel numbers per firmware)</text>
  <g>
    <rect x="820" y="188" width="300" height="26" class="servo"/><text x="835" y="206" class="lbl">Base — MG996R</text><text x="1105" y="206" text-anchor="end" class="pin">CH 0</text>
    <rect x="820" y="218" width="300" height="26" class="servo"/><text x="835" y="236" class="lbl">Shoulder — MG996R</text><text x="1105" y="236" text-anchor="end" class="pin">CH 2</text>
    <rect x="820" y="248" width="300" height="26" class="servo"/><text x="835" y="266" class="lbl">Elbow — MG996R</text><text x="1105" y="266" text-anchor="end" class="pin">CH 4</text>
    <rect x="820" y="278" width="300" height="26" class="servo"/><text x="835" y="296" class="lbl">Wrist — MG90S</text><text x="1105" y="296" text-anchor="end" class="pin">CH 6</text>
    <rect x="820" y="308" width="300" height="26" class="servo"/><text x="835" y="326" class="lbl">Gripper — MG90S</text><text x="1105" y="326" text-anchor="end" class="pin">CH 8</text>
  </g>
  <!-- PCA9685 -> servos (signal + power delivered per channel header) -->
  <path class="sig" d="M712,200 C760,200 780,201 820,201" marker-end="url(#arrow)"/>
  <path class="sig" d="M712,230 C760,230 780,231 820,231" marker-end="url(#arrow)"/>
  <path class="sig" d="M712,260 C760,260 780,261 820,261" marker-end="url(#arrow)"/>
  <path class="sig" d="M712,290 C760,290 780,291 820,291" marker-end="url(#arrow)"/>
  <path class="sig" d="M712,320 C760,320 780,321 820,321" marker-end="url(#arrow)"/>

  <!-- ESP32-CAM (wireless) -->
  <rect x="60" y="470" width="300" height="170" class="box cam"/>
  <text x="210" y="500" text-anchor="middle" class="title" font-size="17">ESP32-CAM (OV2640)</text>
  <text x="210" y="521" text-anchor="middle" class="sub">optional · own 5 V supply (FTDI/USB)</text>
  <text x="210" y="548" text-anchor="middle" class="lbl">No wires to the arm</text>
  <text x="210" y="574" text-anchor="middle" class="sub">joins the arm's WiFi AP</text>
  <text x="210" y="596" text-anchor="middle" class="pin">static IP 192.168.4.50</text>
  <text x="210" y="620" text-anchor="middle" class="sub">serves /capture · /stream</text>

  <!-- WiFi link cam <-> arm (the ESP32 hosts the AP) -->
  <path class="wifi" d="M175,470 C175,410 150,380 175,340"/>
  <text x="120" y="405" class="sub" fill="#a855f7">Wi-Fi AP</text>
  <text x="120" y="420" class="sub" fill="#a855f7">RobotArm-XXXX</text>

  <!-- Legend -->
  <rect x="820" y="470" width="300" height="170" fill="#0f172a" stroke="#334155" stroke-width="1" rx="10"/>
  <text x="838" y="496" class="title" font-size="14">Legend</text>
  <line x1="838" y1="516" x2="872" y2="516" class="i2c"/><text x="882" y="520" class="sub">I²C (SDA/SCL) + 3.3 V logic</text>
  <line x1="838" y1="540" x2="872" y2="540" class="pwr"/><text x="882" y="544" class="sub">5 V servo power (isolated rail)</text>
  <line x1="838" y1="564" x2="872" y2="564" class="gnd"/><text x="882" y="568" class="sub">Ground (common)</text>
  <line x1="838" y1="588" x2="872" y2="588" class="sig"/><text x="882" y="592" class="sub">PWM signal → servo</text>
  <line x1="838" y1="612" x2="872" y2="612" class="wifi"/><text x="882" y="616" class="sub">Wireless (no physical wire)</text>

  <text x="590" y="690" text-anchor="middle" class="warn">⚠ Never power servos from the ESP32 3.3V/5V pins · tie all grounds together · RIAL-3-2425-C7</text>
</svg>
