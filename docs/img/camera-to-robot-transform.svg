<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
    <style>
      .box   { fill:#ffffff; stroke:#334155; stroke-width:1.6; rx:8; }
      .cam   { fill:#eef6ff; stroke:#2563eb; }
      .ai    { fill:#ecfdf5; stroke:#059669; }
      .now   { fill:#fef9c3; stroke:#ca8a04; }
      .fut   { fill:#f5f3ff; stroke:#7c3aed; stroke-dasharray:6 4; }
      .arm   { fill:#fee2e2; stroke:#dc2626; }
      .t     { fill:#0f172a; font-size:14px; }
      .tb    { fill:#0f172a; font-size:14px; font-weight:700; }
      .sub   { fill:#64748b; font-size:11px; }
      .lbl   { fill:#334155; font-size:11px; }
      .flow  { stroke:#334155; stroke-width:1.6; fill:none; }
      .futflow { stroke:#7c3aed; stroke-width:1.6; fill:none; stroke-dasharray:6 4; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="620" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" class="tb" font-size="19">Camera-to-Robot Coordinate Transformation</text>
  <text x="450" y="54" text-anchor="middle" class="sub">Solid = implemented (class → taught pose)  ·  Dashed = future work (pixel → arm coordinates)</text>

  <!-- 1 capture -->
  <rect class="box cam" x="60" y="90" width="220" height="66"/>
  <text x="170" y="118" text-anchor="middle" class="tb">1 · Capture frame</text>
  <text x="170" y="138" text-anchor="middle" class="sub">ESP32-CAM (gripper) at SCAN_POSE, arm settled</text>

  <!-- 2 detect -->
  <rect class="box ai" x="340" y="90" width="230" height="66"/>
  <text x="455" y="114" text-anchor="middle" class="tb">2 · YOLOv8 detection</text>
  <text x="455" y="132" text-anchor="middle" class="sub">outputs: class + confidence</text>
  <text x="455" y="147" text-anchor="middle" class="sub">+ bounding box (pixel x,y)</text>

  <!-- split note -->
  <rect class="box" x="630" y="90" width="210" height="66"/>
  <text x="735" y="114" text-anchor="middle" class="tb">3 · Two mapping paths</text>
  <text x="735" y="134" text-anchor="middle" class="sub">use CLASS (now) vs PIXEL (future)</text>

  <path class="flow" d="M280,123 H340" marker-end="url(#arr)"/>
  <path class="flow" d="M570,123 H630" marker-end="url(#arr)"/>

  <!-- ===== IMPLEMENTED PATH (class -> pose) ===== -->
  <rect x="40" y="200" width="820" height="180" fill="#fffef5" stroke="#ca8a04" stroke-width="1.2" rx="10"/>
  <text x="60" y="224" class="tb" fill="#ca8a04">IMPLEMENTED — class → taught drop-pose (fixed feed position)</text>

  <rect class="box now" x="60" y="240" width="210" height="60"/>
  <text x="165" y="266" text-anchor="middle" class="t">Take top detection's</text>
  <text x="165" y="284" text-anchor="middle" class="tb">class name</text>

  <rect class="box now" x="320" y="240" width="230" height="60"/>
  <text x="435" y="262" text-anchor="middle" class="t">Look up the taught pose</text>
  <text x="435" y="280" text-anchor="middle" class="sub">e.g. brick_2x4 → DROP_BRICK_2x4</text>

  <rect class="box arm" x="600" y="240" width="240" height="60"/>
  <text x="720" y="262" text-anchor="middle" class="t">Replay stored joint angles</text>
  <text x="720" y="280" text-anchor="middle" class="sub">arm_controller_ap_mode.ino · targetPos[]</text>

  <path class="flow" d="M270,270 H320" marker-end="url(#arr)"/>
  <path class="flow" d="M550,270 H600" marker-end="url(#arr)"/>

  <text x="60" y="336" class="lbl">Object is placed at a fixed PICKUP position, so NO pixel→coordinate math is needed —</text>
  <text x="60" y="354" class="lbl">the class selects a pre-recorded pose. This is "lead-through teaching," reliable on open-loop servos.</text>

  <!-- ===== FUTURE PATH (pixel -> coordinate) ===== -->
  <rect x="40" y="410" width="820" height="180" fill="#faf7ff" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="6 4" rx="10"/>
  <text x="60" y="434" class="tb" fill="#7c3aed">FUTURE WORK — pixel → arm coordinates (pick objects anywhere in view)</text>

  <rect class="box fut" x="60" y="450" width="200" height="64"/>
  <text x="160" y="476" text-anchor="middle" class="t">Bounding-box center</text>
  <text x="160" y="494" text-anchor="middle" class="sub">(pixel u, v)</text>

  <rect class="box fut" x="300" y="450" width="230" height="64"/>
  <text x="415" y="472" text-anchor="middle" class="t">Homography / calibration</text>
  <text x="415" y="490" text-anchor="middle" class="sub">pixel → table (x,y) in mm</text>

  <rect class="box fut" x="570" y="450" width="270" height="64"/>
  <text x="705" y="472" text-anchor="middle" class="t">Inverse kinematics</text>
  <text x="705" y="490" text-anchor="middle" class="sub">table (x,y,z) → joint angles</text>

  <path class="futflow" d="M260,482 H300" marker-end="url(#arr)"/>
  <path class="futflow" d="M530,482 H570" marker-end="url(#arr)"/>

  <text x="60" y="548" class="lbl" fill="#7c3aed">Requires a calibrated fixed/eye-in-hand camera model + IK — the scan pose gives full-workspace</text>
  <text x="60" y="566" class="lbl" fill="#7c3aed">coverage today; free-space grasping from detected coordinates is the next step.</text>
</svg>
